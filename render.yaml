services:
  - type: web
    name: nestjs-productos-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: productos-db
          property: connectionString

databases:
  - name: productos-db
    plan: free
    # Puedes dejar los valores por defecto o personalizarlos, Render los auto-genera si no se especifican.
